<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EHIRS Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f7f5;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 420px;
            border: none;
            border-radius: 15px;
        }

        .login-header {
            background: #198754;
            color: white;
            border-radius: 15px 15px 0 0;
        }

        .btn-success {
            background: #198754;
            border-color: #198754;
        }

    </style>

</head>


<body>

<div class="container login-container">

    <div class="card login-card shadow">

        <div class="login-header text-center p-4">

            <h2 class="mb-1">
                EHIRS
            </h2>

            <p class="mb-0">
                Ethiopian Health Information Revolution System
            </p>

        </div>


        <div class="card-body p-4">

            <h4 class="text-center mb-4">
                User Login
            </h4>


            {% if form.errors %}

            <div class="alert alert-danger">

                Username or password is incorrect.

            </div>

            {% endif %}


            <form method="post">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required
                        autofocus
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    Login
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
